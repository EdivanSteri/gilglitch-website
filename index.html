<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chango&family=Kaushan+Script&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <!-- google icons-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu"
    />

    <!-- styles -->
    <link rel="stylesheet" href="./Styles/style.css" />
    <link rel="stylesheet" href="./Styles/mediaQueries.css" />

    <script src="./Scripts/script.js" defer></script>

    <title>Gilglitch - Where Music Meets Art</title>
  </head>
  <body>
    <header class="hero_section">
      <div class="left_hero_section">
        <div class="hero_header">
          <h1 class="primary_heading hero_title">GILGLITCH</h1>
          <p class="hero_slogan">Where Music Meets Art</p>
          <a class="btn explore_btn" href="#">Explore the gallery</a>
        </div>
      </div>
      <div class="right_hero_section">
        <div class="hamburgher-wrapper hide">
          <span class="material-symbols-outlined"> menu </span>
        </div>
        <nav class="navbar">
          <ul class="navbar_list">
            <li><a class="btn navbar_item" href="#">Home</a></li>
            <li><a class="btn navbar_item" href="#">Gallery</a></li>
            <li>
              <a class="btn navbar_item inspirations_item" href="#"
                >Inspirations</a
              >
              <div class="menu_inspirations hide">
                <ul class="inspirations_list">
                  <li>
                    <a class="btn navbar_item" href="#">Music</a>
                  </li>
                  <li>
                    <a class="btn navbar_item" href="#">About Me</a>
                  </li>
                </ul>
              </div>
            </li>
            <li>
              <a class="btn navbar_item collaborations_item" href="#"
                >Collaborations</a
              >
              <div class="menu_collaborations hide">
                <ul class="collaborations_list">
                  <li>
                    <a class="btn navbar_item" href="#">Sponsorships</a>
                  </li>
                  <li>
                    <a class="btn navbar_item" href="#">Commissions</a>
                  </li>
                </ul>
              </div>
            </li>
            <li><a class="btn navbar_item" href="#">Contacts</a></li>
          </ul>
        </nav>
        <div>
          <img
            class="img_hero_section"
            src="./Media/images-without-background/tha-supreme-sulla-luna-senza-sfondo.png"
            alt="sketch by Tha Supreme on the moon"
          />
        </div>
      </div>
    </header>
  </body>
</html>
